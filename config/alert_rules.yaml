alerts:
  - name: HighLatencyP95
    severity: warning
    condition: latency_p95_ms > 3000
    for: 5m
    type: symptom-based
    owner: sre-oncall
    runbook: docs/alerts.md#highlatencyp95

  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2
    for: 5m
    type: symptom-based
    owner: sre-oncall
    runbook: docs/alerts.md#higherrorrate

  - name: DailyCostBudgetRisk
    severity: warning
    condition: daily_cost_usd > 2.5
    for: 15m
    type: symptom-based
    owner: sre-oncall
    runbook: docs/alerts.md#dailycostbudgetrisk
