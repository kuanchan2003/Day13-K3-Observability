alerts:
  - name: HighLatencyP95
    severity: warning
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: ai-platform-oncall
    runbook: docs/alerts.md#alert-1
  - name: ElevatedErrorRate
    severity: critical
    condition: error_rate_pct > 2 for 5m and request_count >= 20
    type: symptom-based
    owner: ai-platform-oncall
    runbook: docs/alerts.md#alert-2
  - name: QualityRegression
    severity: warning
    condition: quality_score_avg < 0.75 for 15m and request_count >= 20
    type: symptom-based
    owner: ai-quality-oncall
    runbook: docs/alerts.md#alert-3
